name: Daily All Scanners

on:
  schedule:
    # 10:20 UTC = 3:50 PM IST, Monday-Friday
    - cron: '20 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run RSI screener (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python nifty500_rsi_screener.py

      - name: Run Daily + 4H RSI + Hourly Volume scanner (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python nifty500_rsi_volume_intraday.py

      - name: Run Daily Marubozu reversal scanner (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          TIMEFRAME: DAILY
        run: python nifty500_marubozu_reversal_scanner.py

      - name: Run Hourly Marubozu reversal scanner (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          TIMEFRAME: HOURLY
        run: python nifty500_marubozu_reversal_scanner.py

      - name: Run Breakout scanner (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python breakout_scanner_auto.py

      - name: Run MIB Market scanner (Nifty 50 + extras)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
        run: python mib_market_scanner.py

      - name: Run Engulfing @ S/R scanner (Nifty 500, Daily)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          INDEX_CHOICE: NIFTY500
          TF_CHOICE: "7"
        run: python nifty_engulf_scanner.py

      - name: Run Pharma Breakout scanner (Weekly TF)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
        run: python pharma_breakout_scanner.py

      - name: Normalize MIB and Engulfing latest CSVs
        continue-on-error: true
        run: |
          DATE=$(date +%Y%m%d)
          if [ -f "output/mib_market_scan_${DATE}.csv" ]; then
            cp "output/mib_market_scan_${DATE}.csv" "output/mib_market_scan_latest.csv"
          else
            echo "MIB dated CSV not found"
          fi
          if [ -f "output/engulfing_scan_${DATE}.csv" ]; then
            cp "output/engulfing_scan_${DATE}.csv" "output/engulfing_scan_latest.csv"
          else
            echo "Engulfing dated CSV not found"
          fi

      - name: Remove scanners with no eligible data
        continue-on-error: true
        env:
          OUTPUT_DIR: output
        run: python cleanup_empty_scan_results.py

      - name: Send combined email with latest CSVs only
        env:
          OUTPUT_DIR: output
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_combined_email.py

      - name: Upload all CSVs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-scan-results
          path: output/*.csv
