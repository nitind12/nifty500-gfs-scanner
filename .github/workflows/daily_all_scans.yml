name: Daily All Scanners

on:
  schedule:
    # 10:20 UTC = 3:50 PM IST, Monday-Friday
    - cron: '20 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run RSI screener (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python nifty500_rsi_screener.py

      - name: Run Breakout scanner (Nifty 500)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python breakout_scanner_auto.py

      - name: Run MIB Watchlist scanner
        continue-on-error: true
        env:
          OUTPUT_DIR: output
        run: python mib_scanner_yfinance.py

      - name: Run MIB Market scanner (Nifty 50 + extras)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
        run: python mib_market_scanner.py

      - name: Run Engulfing @ S/R scanner (Nifty 500, Daily)
        continue-on-error: true
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          INDEX_CHOICE: NIFTY500
          TF_CHOICE: "7"
        run: python nifty_engulf_scanner.py

      - name: Send combined email with all CSVs
        env:
          OUTPUT_DIR: output
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_combined_email.py

      - name: Upload all CSVs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-scan-results
          path: output/*.csv
