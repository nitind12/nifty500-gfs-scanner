name: Hammer / Inverted-Hammer @ S-R Scan

on:
  # GitHub's own `schedule:` cron trigger is best-effort only and can be
  # delayed/bunched during high load, so timing is instead handled by an
  # external cron service (cron-job.org) calling this workflow's
  # workflow_dispatch endpoint at exact times - see repo README / chat
  # notes for the 4 scheduled times (9:16 AM, 11:16 AM, 1:16 PM, 3:00 PM IST).
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run Hammer/Inverted-Hammer @ S-R scanner (Daily + Hourly)
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
        run: python hammer_sr_scanner.py

      - name: Email results (if any signals found)
        env:
          OUTPUT_DIR: output
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_combined_email.py

      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammer-sr-scan-results
          path: output/*.csv
