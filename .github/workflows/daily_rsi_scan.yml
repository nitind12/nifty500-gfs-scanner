name: Nifty500 Daily RSI Scan

on:
  schedule:
    # 10:20 UTC = 3:50 PM IST, Monday-Friday
    - cron: '20 10 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSI screener
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python nifty500_rsi_screener.py

      - name: Upload CSV as workflow artifact (backup, 90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: rsi-scan-results
          path: output/*.csv
