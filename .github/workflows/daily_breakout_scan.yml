name: Nifty50 Daily Breakout Scan

on:
    # schedule:
    # 10:20 UTC = 3:50 PM IST, Monday-Friday (runs alongside the RSI scan)
    # - cron: '20 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance requests

      - name: Run breakout scanner
        env:
          OUTPUT_DIR: output
          LOCAL_FALLBACK_LIST: ind_nifty500list.csv
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python breakout_scanner_auto.py

      - name: Upload CSV as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: breakout-scan-results
          path: output/*.csv
